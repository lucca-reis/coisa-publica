name: Contatos dos parlamentares

on:
  schedule:
    - cron: '41 9 * * 1'   # toda segunda às 6h41 de Brasília (contatos mudam pouco)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/contatos.py', '.github/workflows/contatos.yml']

permissions:
  contents: write

concurrency:
  group: contatos
  cancel-in-progress: false

jobs:
  contatos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contatos oficiais e redes sociais (Câmara, Senado, TSE)
        run: python scripts/contatos.py
        timeout-minutes: 30
      - name: Salvar se mudou
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Contatos atualizados $(TZ=America/Sao_Paulo date '+%d/%m')"
          for t in 1 2 3 4 5; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((t*7)); done; exit 1
