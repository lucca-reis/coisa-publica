name: Propostas de cada ministério

on:
  schedule:
    - cron: '23 10 * * 3'   # toda quarta às 7h23 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/ministerios.py', '.github/workflows/ministerios.yml']

permissions:
  contents: write

concurrency:
  group: ministerios
  cancel-in-progress: false

jobs:
  ministerios:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leitor de PDF
        run: pip install pypdf
      - name: Propostas do Executivo na Câmara e o ministério de cada uma
        run: python scripts/ministerios.py
        timeout-minutes: 50
      - name: Salvar se mudou
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Propostas dos ministérios atualizadas $(TZ=America/Sao_Paulo date '+%d/%m')"
          git pull --rebase origin main
          git push
