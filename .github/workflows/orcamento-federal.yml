name: Orçamento federal (página #orcamento)

on:
  schedule:
    - cron: '23 9 * * 0'   # todo domingo às 6h23 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/orcamento_federal.py', '.github/workflows/orcamento-federal.yml']

permissions:
  contents: write

concurrency:
  group: orcamento-federal
  cancel-in-progress: false

jobs:
  orcamento:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Orçamento da despesa do ano (Portal da Transparência)
        run: python scripts/orcamento_federal.py
        timeout-minutes: 30
      - name: Salvar se mudou
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcamento-federal.json
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Orçamento federal atualizado $(TZ=America/Sao_Paulo date '+%d/%m')"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done; exit 1
