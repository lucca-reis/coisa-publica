name: Orçamento executado por órgão

on:
  schedule:
    - cron: '17 11 * * 2'   # toda terça às 8h17 de Brasília (o Portal publica os arquivos do mês ao longo do mês seguinte)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/orcamento.py', '.github/workflows/orcamento.yml']

permissions:
  contents: write

concurrency:
  group: orcamento
  cancel-in-progress: false

jobs:
  orcamento:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execução da despesa do ano, por órgão (Portal da Transparência)
        run: python scripts/orcamento.py
        timeout-minutes: 50
      - name: Salvar se mudou
        run: |
          git config user.name "quorum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Orçamento atualizado $(TZ=America/Sao_Paulo date '+%d/%m')"
          git pull --rebase origin main
          git push
