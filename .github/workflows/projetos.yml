name: Projetos do mandato atual

on:
  schedule:
    - cron: '41 8 * * *'   # todo dia às 5h41 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/projetos.py', '.github/workflows/projetos.yml']

permissions:
  contents: write

concurrency:
  group: projetos
  cancel-in-progress: false

jobs:
  projetos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Câmara, Senado e Executivo desde o início do mandato
        run: python scripts/projetos.py
        timeout-minutes: 50
      - name: Salvar se mudou
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Projetos do mandato atualizados $(TZ=America/Sao_Paulo date '+%d/%m')"
          git pull --rebase -X theirs origin main
          git push
