name: Publicar posts aprovados

# Um post aprovado é um post que chegou à main (pelo "Merge" do pedido de aprovação). Ele sai na hora do seu
# período (manhã 8h, tarde 13h, noite 18h); se for aprovado depois dessa hora, sai assim que chega à main.
on:
  push:
    branches: [main]
    paths: ['posts/2*/**', 'posts/apagar.json']
  schedule:
    # o GitHub costuma atrasar os agendamentos (às vezes 30 a 45 minutos): três tentativas na hora anterior a cada
    # horário (7h10, 7h25, 7h40; 12h10…; 17h10…); a primeira que rodar espera até a hora certa e publica
    - cron: '10,25,40 10,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apagar posts que vão ser refeitos (posts/apagar.json)
        run: python scripts/posts/apagar.py
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Publicar no Bluesky e no Instagram
        run: python scripts/posts/publicar.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Posts publicados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for t in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((t*7)); done; exit 1
