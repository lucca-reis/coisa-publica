name: Publicar posts aprovados

# Um post aprovado é um post que chegou à main (pelo "Merge" do pedido de aprovação).
on:
  push:
    branches: [main]
    paths: ['posts/2*/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar no Bluesky e no Instagram
        run: python scripts/posts/publicar.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "quorum-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Posts publicados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase origin main
          git push
