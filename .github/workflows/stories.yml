name: Stories ao vivo

# Das 9h às 23h (Brasília), de hora em hora, uma execução que confere a cada 5 minutos, por cerca de 50 minutos, o que
# está no ar (o agendamento a cada 10 minutos do GitHub atrasava e pulava rodadas). Em cada conferência:
# - atualiza data/aovivo.json (Plenário e comissões abertos agora, STF e Presidência), que a seção "Ao vivo agora" do
#   site lê: o que entra aparece e o que acaba sai do site;
# - se a Câmara, o Senado, o STF ou a Presidência começou uma transmissão oficial, publica um story no Instagram com a
#   arte de scripts/posts/story-live.js (uma vez por sessão; comissões, no máximo uma por Casa a cada 3 horas).
on:
  schedule:
    - cron: '3 12-23 * * *'
    - cron: '3 0-1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir a cada 5 minutos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          enviar(){   # grava o que mudou e manda para a main
            git add posts/stories/ data/aovivo.json 2>/dev/null || true
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "$1 $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            for t in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && return 0; sleep 5; done
            echo "não consegui enviar"
          }
          PW=0
          for rodada in $(seq 1 10); do
            git pull -q --rebase -X theirs origin main || git rebase --abort 2>/dev/null || true
            node scripts/posts/stories.js preparar || true
            if [ -f posts/stories/pendentes.json ]; then
              if [ "$PW" = 0 ]; then npm i --no-save --no-package-lock playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null && PW=1; fi
              node scripts/posts/stories.js arte || true
              enviar "Story ao vivo"
              node scripts/posts/stories.js publicar || true
              enviar "Stories publicados"
            else
              enviar "Ao vivo agora"
            fi
            if [ "$rodada" -lt 10 ]; then sleep 300; fi
          done
