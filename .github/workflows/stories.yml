name: Stories ao vivo

# A cada 10 minutos, das 9h às 23h (Brasília): se a Câmara, o Senado, o STF ou a Presidência começou uma transmissão
# oficial, publica um story no Instagram com a arte de scripts/posts/story-live.js (uma vez por sessão; comissões, no
# máximo uma por Casa a cada 3 horas). Também atualiza data/aovivo.json (Plenário e comissões abertos agora), que a
# seção "Ao vivo agora" do site lê.
on:
  schedule:
    - cron: '*/10 12-23 * * *'
    - cron: '*/10 0-2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  stories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: O que está ao vivo agora
        run: node scripts/posts/stories.js preparar
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Atualizar o "Ao vivo agora" do site
        if: hashFiles('posts/stories/pendentes.json') == ''
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aovivo.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ao vivo agora $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -X theirs origin main
          git push
      - name: Gerar a arte
        if: hashFiles('posts/stories/pendentes.json') != ''
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/posts/stories.js arte
      - name: Enviar a arte para o site
        if: hashFiles('posts/stories/pendentes.json') != ''
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/stories/ data/aovivo.json
          git commit -m "Story ao vivo $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -X theirs origin main
          git push
      - name: Publicar no Instagram
        if: hashFiles('posts/stories/pendentes.json') != ''
        run: node scripts/posts/stories.js publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Registrar o que foi publicado
        if: always()
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/stories/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stories publicados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          git pull --rebase -X theirs origin main
          git push
