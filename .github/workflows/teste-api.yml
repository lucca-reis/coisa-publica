name: Teste API comissoes
on:
  push:
    branches: [teste-api-comissoes]
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash t.sh || true
          git config user.name t; git config user.email t@t
          git add -f out && git commit -qm "saida do teste" && git push origin HEAD:teste-api-comissoes
