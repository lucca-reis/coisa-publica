name: Transparência (cota parlamentar)

on:
  schedule:
    - cron: '23 10 * * *'   # todo dia às 7h23 de Brasília, depois que Câmara e Senado publicam
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/transparencia.py', 'scripts/votos.py', 'scripts/leis.py', '.github/workflows/transparencia.yml']

permissions:
  contents: write

concurrency:
  group: transparencia
  cancel-in-progress: false

jobs:
  transparencia:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar gastos da cota parlamentar
        run: python scripts/transparencia.py
      - name: Votos nominais dos projetos do site
        run: python scripts/votos.py
        continue-on-error: true
        timeout-minutes: 15
      - name: Normas aprovadas no último ano, por partido do autor
        run: python scripts/leis.py
        continue-on-error: true
        timeout-minutes: 30
      - name: Portal da Transparência (Presidência e ministérios)
        run: python scripts/portal.py
        continue-on-error: true
        timeout-minutes: 40
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
      - name: Salvar se mudou
        run: |
          git config user.name "coisa-publica-robo"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Transparência atualizada $(TZ=America/Sao_Paulo date '+%d/%m')"
          for t in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep $((t*7)); done; exit 1
