<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--ink:#121417;--bg:#F3F3F3;--gray:color-mix(in srgb,#121417 14%,#F3F3F3);--muted:#6E6F73;--card:color-mix(in srgb,#121417 5%,#F3F3F3);--k:1}
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;min-height:1350px;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding:84px 84px 64px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:30px;color:var(--muted)}
.logo{font-size:46px;color:var(--ink);letter-spacing:-.015em}.logo i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--dot);margin:0 .02em;vertical-align:-.02em}
.eye{margin:calc(80px * var(--k)) 0 0;font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:20px 0 0;font-size:calc(88px * var(--k));line-height:1.03;letter-spacing:-.035em;font-weight:700}
.lede{margin:22px 0 0;font-size:calc(31px * var(--k));line-height:1.38;color:var(--muted)}
.card{margin-top:auto;background:var(--card);border-radius:44px;padding:calc(46px * var(--k)) 52px;display:flex;flex-direction:column;gap:calc(26px * var(--k))}
.tags{display:flex;gap:12px;flex-wrap:wrap}.pill{padding:11px 22px;border-radius:999px;font-size:25px}
.leg{background:color-mix(in srgb,#F2C200 30%,var(--bg));color:color-mix(in srgb,#F2C200 30%,var(--ink))}
.jud{background:color-mix(in srgb,#1F4FB5 14%,var(--bg));color:color-mix(in srgb,#1F4FB5 66%,var(--ink))}
.exe{background:color-mix(in srgb,#009C3B 16%,var(--bg));color:color-mix(in srgb,#009C3B 72%,var(--ink))}
.t{background:color-mix(in srgb,var(--tc) 14%,var(--bg));color:color-mix(in srgb,var(--tc) 78%,var(--ink))}
.ct{margin:16px 0 0;font-size:calc(44px * var(--k));line-height:1.12;letter-spacing:-.02em;font-weight:500}
.cs{margin:8px 0 0;font-size:calc(31px * var(--k));line-height:1.38;color:color-mix(in srgb,var(--ink) 72%,var(--bg))}
.card > .cs{margin:0}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:30px}
.big{font-size:calc(120px * var(--k));font-weight:700;letter-spacing:-.04em;line-height:.9}
.leg2{display:flex;gap:26px;margin-top:20px;font-size:26px;color:var(--muted)}.leg2 i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:-2px}
.list{display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:calc(26px * var(--k)) 0;border-top:2px solid color-mix(in srgb,var(--ink) 10%,var(--bg))}.it:first-child{border-top:0;padding-top:4px}.it:last-child{padding-bottom:0}
.d{font-size:28px;color:var(--muted);line-height:1.2}.d b{display:block;font-size:calc(56px * var(--k));color:var(--ink);letter-spacing:-.03em}
.foot{margin-top:40px;display:flex;justify-content:space-between;gap:30px;font-size:24px;color:var(--muted)}
/* posts de um assunto só: fundo #F3F3F3, o tema numa etiqueta na cor do poder, sem caixa, com um desenho grande no meio */
body.cheio.p-leg{--pc:#F2C200;--pci:#121417}
body.cheio.p-jud{--pc:#1F4FB5;--pci:#F3F3F3}
body.cheio.p-exe{--pc:#009C3B;--pci:#F3F3F3}
.cheio .eye{display:flex;align-items:center;gap:14px;margin-top:calc(72px * var(--k));font-size:26px;letter-spacing:.08em;color:var(--muted)}
.cheio .eye::before{content:"";width:18px;height:18px;border-radius:50%;background:var(--pc)}
.cheio h1{margin-top:26px;max-width:16ch}
.cheio .vis{flex:1;display:grid;place-items:center;padding:calc(30px * var(--k)) 0}
.cheio .tags{margin-top:auto}
.cheio .txt{margin:0;font-size:calc(36px * var(--k));line-height:1.35;max-width:28ch;color:color-mix(in srgb,var(--ink) 80%,var(--bg))}
.nums{display:flex;justify-content:center;gap:64px;margin-top:-26px;text-align:center}
.nums b{display:block;font-size:calc(124px * var(--k));font-weight:700;letter-spacing:-.04em;line-height:1}
.nums span{font-size:26px;color:var(--muted)}
.dat{display:grid;grid-template-columns:auto auto;gap:56px;align-items:center;width:fit-content;max-width:100%;margin:0 auto;box-sizing:border-box}
.dat .circ{width:calc(380px * var(--k));height:calc(380px * var(--k));border-radius:50%;background:var(--pc);color:#F3F3F3;display:grid;place-items:center}
.dat .mesa{width:calc(400px * var(--k))}
.dat .circ svg{width:55%}
.dat small{display:block;font-size:30px;color:var(--muted);max-width:280px}
.dat b{display:block;font-size:calc(150px * var(--k));font-weight:700;letter-spacing:-.045em;line-height:.95}
.cheio .row{width:100%;align-items:center}
.cheio .leg2{color:var(--muted)}
.perg{flex:1;display:flex;align-items:center}
.perg p{margin:0;font-size:calc(104px * var(--k));line-height:1.02;letter-spacing:-.04em;font-weight:700}
.prod{display:flex;align-items:center;gap:36px;padding:34px 0 0;border-top:3px solid var(--gray)}
.psym svg{width:150px;display:block}
.prod small{display:block;font-size:30px;color:var(--muted)}
.prod b{display:block;font-size:calc(74px * var(--k));font-weight:700;letter-spacing:-.03em;line-height:1.05}
</style></head><body></body></html>
